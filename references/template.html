<!--
  瑞士国际主义 · 公众号排版 HTML 模板
  规则来源：公众号排版笔记 N° 62（全部数字为视频标注实测值）
  用法：整段复制到公众号编辑器（或句方便等第三方编辑器）。
  注意：公众号编辑器剥离 <style>/class，以下全部使用内联样式。
  仅允许改动：文字内容、一级/二级/三级/引用/正文的替换；数值（字号/线宽/间距/红色）不得改动。
-->
<section style="font-family: 'PingFang SC', system-ui, 'Microsoft YaHei', sans-serif; color: #111111; text-align: left;">

  <!-- 文章主标题（可选，不属于 32px 阶梯；32px 粗体 + 灰色小注） -->
  <h1 style="margin: 0 0 6px 0; font-size: 32px; font-weight: bold; line-height: 1.4; text-align: left;">
    说明书为什么越简单越好读
  </h1>
  <!-- 标题区小注：12px 灰（唯一允许的阶梯外字号） -->
  <p style="margin: 0 0 36px 0; font-size: 12px; color: #999999; text-align: left;">
    设计周记&nbsp;&nbsp;11月12日
  </p>

  <!-- 一级标题：32px + 左侧 8px 红条（红线竖点·其一） -->
  <h2 style="margin: 36px 0 18px 0; font-size: 32px; font-weight: bold; line-height: 1.4;
             border-left: 8px solid #D00013; padding-left: 12px; text-align: left;">
    一、起点只有一个
  </h2>

  <!-- 正文：16px -->
  <p style="margin: 0 0 18px 0; font-size: 16px; line-height: 1.9; text-align: left;">
    好的说明书不靠花样取胜。它把每一行的起点放在同一个位置，读者的眼睛不用来回找。
  </p>

  <!-- 三级标题：20px -->
  <h3 style="margin: 26px 0 12px 0; font-size: 20px; font-weight: bold; line-height: 1.5; text-align: left;">
    对齐，是最便宜的高级感
  </h3>

  <p style="margin: 0 0 18px 0; font-size: 16px; line-height: 1.9; text-align: left;">
    标题、正文、引用全部靠左，版面立刻安静下来。
  </p>

  <!-- 引用：18px + 左侧细红线（红线竖点·其二） -->
  <blockquote style="margin: 22px 0; font-size: 18px; line-height: 1.8;
                    border-left: 2px solid #D00013; padding-left: 12px; text-align: left;">
    好的版式，让人感觉不到版式。
  </blockquote>

  <p style="margin: 0 0 18px 0; font-size: 16px; line-height: 1.9; text-align: left;">
    颜色只留给真正要紧的地方，其余交给黑白。
  </p>

  <!-- 分隔线：2px 黑线，上下各空 50px（黑线横切） -->
  <section style="border-top: 2px solid #111111; margin: 50px 0; height: 0; font-size: 0;"></section>

  <!-- 二级标题：24px，上方压一道 2px 黑线 -->
  <h3 style="margin: 0 0 18px 0; font-size: 24px; font-weight: bold; line-height: 1.5;
             border-top: 2px solid #111111; padding-top: 16px; text-align: left;">
    字号，一级差四号
  </h3>

  <p style="margin: 0 0 18px 0; font-size: 16px; line-height: 1.9; text-align: left;">
    正文16号，三级标题20号，二级标题24号，一级标题32号。
  </p>

  <!-- 一级标题再次出现：照旧 8px 红条 -->
  <h2 style="margin: 36px 0 18px 0; font-size: 32px; font-weight: bold; line-height: 1.4;
             border-left: 8px solid #D00013; padding-left: 12px; text-align: left;">
    二、线比色块安静
  </h2>

  <p style="margin: 0 0 18px 0; font-size: 16px; line-height: 1.9; text-align: left;">
    横线负责分段，竖线负责提醒。线条越少，越显得笃定。
  </p>

</section>
